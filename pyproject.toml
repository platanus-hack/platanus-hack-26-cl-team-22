[project]
name = "travel-sim"
version = "0.1.0"
description = "Deterministic travel cost vs friction simulator (Santiago de Chile pilot)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["travel_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
