[project]
name = "team22-simulation"
version = "0.1.0"
description = "Platanus Hack 26 Santiago - team 22 - Simulations track"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
agents = ["mesa>=3.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12"]
datos = ["pandas>=2.2", "openpyxl>=3.1", "requests>=2.31"]

[tool.setuptools]
packages = ["core", "experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["external", ".venv"]
